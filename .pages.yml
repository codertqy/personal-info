media:
  input: public/images
  output: /images
  rename: safe
  categories: [image]

content:
  - name: gallery
    label: 图库
    type: collection
    path: src/content/gallery
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      fields: [title, captured, category, featured, draft]
      primary: title
      sort: [order, captured, title]
      search: [title, category, location, imageAlt]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: 图片标题
        type: string
        required: true
      - name: image
        label: 图片
        type: image
        required: true
        description: 建议上传 WebP、JPEG 或 PNG；横图建议至少 1600 像素宽。
      - name: imageAlt
        label: 图片说明
        type: string
        required: true
        description: 用一句话描述画面内容，方便无障碍阅读。
      - name: captured
        label: 日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: category
        label: 分类
        type: select
        required: true
        default: 日常
        options:
          values: [日常, 天气, 城市, 旅途]
      - name: location
        label: 地点（可选）
        type: string
      - name: orientation
        label: 图片方向
        type: select
        required: true
        default: landscape
        options:
          values:
            - name: landscape
              label: 横图
            - name: portrait
              label: 竖图
      - name: featured
        label: 推荐到首页
        type: boolean
        default: true
      - name: order
        label: 首页顺序
        type: number
        required: true
        default: 99
        description: 数字越小越靠前；首页最多展示前六张。
      - name: draft
        label: 暂不公开
        type: boolean
        default: false

settings:
  commit:
    identity: user
    templates:
      create: "图库：新增 {filename}"
      update: "图库：更新 {filename}"
      delete: "图库：删除 {filename}"
      rename: "图库：重命名 {oldFilename} 为 {filename}"
